services:
  - type: web
    name: school-attendance
    runtime: python
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SMS_TOKEN
        sync: false
      - key: SCHOOL_SHORT_NAME
        value: "Shaheed Nur HM School"
      - key: SCHOOL_FULL_NAME
        value: "Shaheed Nur Hossain Memorial School"
      - key: DEFAULT_TEACHER_PASSWORD
        sync: false

  - type: worker
    name: school-attendance-sms-worker
    runtime: python
    buildCommand: ./build.sh
    startCommand: python manage.py process_sms_queue
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SMS_TOKEN
        sync: false
      - key: SCHOOL_SHORT_NAME
        value: "Shaheed Nur HM School"
      - key: SCHOOL_FULL_NAME
        value: "Shaheed Nur Hossain Memorial School"
